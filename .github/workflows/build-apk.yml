name: Auto-Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Prepare Web Assets
        run: |
          mkdir -p www
          cp *.html www/index.html || echo "No HTML file found in root"
          cp -r assets www/assets || echo "No assets folder found, skipping"

      - name: 5. Auto-Install Capacitor & Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Beauty Plus" "com.beautyplus.app" --web-dir www --force

      - name: 6. Unlock Pinch-to-Zoom (Capacitor Config)
        run: |
          # Automatically writes the config file to enable zooming
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.beautyplus.app",
            "appName": "Beauty Plus",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "zoomEnabled": true
            }
          }
          EOF

      - name: 7. Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync

      - name: 8. Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. Upload Final APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: BeautyPlus-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
